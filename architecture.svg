<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <linearGradient id="gradBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="gradYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="gradOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffedd5"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="gradRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fee2e2"/>
      <stop offset="1" stop-color="#fecaca"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">RAG Pipeline — Astronomy Articles</text>
  <text x="600" y="64" text-anchor="middle" font-size="13" fill="#64748b">Baseline (top arrow) vs Improved (bottom arrow). Identical LLM; everything else upgraded.</text>

  <!-- Indexing pipeline (top row) -->
  <text x="60" y="110" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="1">INDEXING (offline)</text>

  <!-- Dataset -->
  <rect x="30" y="130" width="160" height="90" rx="12" fill="url(#gradBlue)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Dataset</text>
  <text x="110" y="180" text-anchor="middle" font-size="11" fill="#1e40af">35 Wikipedia</text>
  <text x="110" y="195" text-anchor="middle" font-size="11" fill="#1e40af">astronomy articles</text>
  <text x="110" y="210" text-anchor="middle" font-size="10" fill="#64748b">(planets, missions, etc.)</text>

  <!-- Chunking -->
  <rect x="230" y="130" width="180" height="90" rx="12" fill="url(#gradGreen)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="320" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Chunking</text>
  <text x="320" y="180" text-anchor="middle" font-size="11" fill="#166534">Baseline: fixed 500 chr</text>
  <text x="320" y="196" text-anchor="middle" font-size="11" fill="#166534">Improved: paragraph,</text>
  <text x="320" y="210" text-anchor="middle" font-size="11" fill="#166534">200 words + 40 overlap</text>

  <!-- Embedding -->
  <rect x="450" y="130" width="180" height="90" rx="12" fill="url(#gradYellow)" stroke="#eab308" stroke-width="1.5"/>
  <text x="540" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">Embedding</text>
  <text x="540" y="180" text-anchor="middle" font-size="11" fill="#854d0e">Baseline: MiniLM-L6</text>
  <text x="540" y="196" text-anchor="middle" font-size="11" fill="#854d0e">Improved: BGE-small-en</text>
  <text x="540" y="210" text-anchor="middle" font-size="10" fill="#64748b">(SentenceTransformers)</text>

  <!-- Vector DB -->
  <rect x="670" y="130" width="170" height="90" rx="12" fill="url(#gradPurple)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="755" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Vector DB</text>
  <text x="755" y="183" text-anchor="middle" font-size="12" fill="#5b21b6">ChromaDB</text>
  <text x="755" y="200" text-anchor="middle" font-size="10" fill="#64748b">cosine similarity</text>

  <!-- BM25 -->
  <rect x="870" y="130" width="170" height="90" rx="12" fill="url(#gradPurple)" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="955" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">BM25 Index</text>
  <text x="955" y="180" text-anchor="middle" font-size="11" fill="#5b21b6">lexical retrieval</text>
  <text x="955" y="196" text-anchor="middle" font-size="11" fill="#5b21b6">(improved only)</text>
  <text x="955" y="212" text-anchor="middle" font-size="10" fill="#64748b">rank_bm25</text>

  <!-- Arrows index row -->
  <line x1="190" y1="175" x2="225" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="175" x2="445" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="175" x2="665" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="220" x2="320" y2="260" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="320" y1="260" x2="955" y2="260" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="955" y1="260" x2="955" y2="225" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- Divider -->
  <line x1="30" y1="295" x2="1170" y2="295" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Query pipeline (bottom row) -->
  <text x="60" y="330" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="1">QUERY (runtime)</text>

  <!-- User Query -->
  <rect x="30" y="350" width="160" height="100" rx="12" fill="url(#gradOrange)" stroke="#f97316" stroke-width="1.5"/>
  <text x="110" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">User Question</text>
  <text x="110" y="402" text-anchor="middle" font-size="11" fill="#9a3412">e.g. "When was JWST</text>
  <text x="110" y="418" text-anchor="middle" font-size="11" fill="#9a3412">launched?"</text>
  <text x="110" y="438" text-anchor="middle" font-size="10" fill="#64748b">+ embed</text>

  <!-- Retrieval -->
  <rect x="230" y="350" width="200" height="100" rx="12" fill="url(#gradPurple)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="330" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Retrieval</text>
  <text x="330" y="400" text-anchor="middle" font-size="11" fill="#5b21b6">Baseline: dense top-3</text>
  <text x="330" y="418" text-anchor="middle" font-size="11" fill="#5b21b6">Improved: hybrid</text>
  <text x="330" y="434" text-anchor="middle" font-size="11" fill="#5b21b6">(BM25 + dense, fetch 10)</text>

  <!-- Rerank -->
  <rect x="470" y="350" width="180" height="100" rx="12" fill="url(#gradRed)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="560" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Reranker</text>
  <text x="560" y="400" text-anchor="middle" font-size="11" fill="#991b1b">cross-encoder</text>
  <text x="560" y="416" text-anchor="middle" font-size="11" fill="#991b1b">ms-marco-MiniLM</text>
  <text x="560" y="434" text-anchor="middle" font-size="10" fill="#64748b">improved only — top 10 → 3</text>

  <!-- Prompt -->
  <rect x="690" y="350" width="200" height="100" rx="12" fill="url(#gradGreen)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="790" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Prompt</text>
  <text x="790" y="400" text-anchor="middle" font-size="11" fill="#166534">Baseline: plain</text>
  <text x="790" y="416" text-anchor="middle" font-size="11" fill="#166534">Improved: cite source,</text>
  <text x="790" y="432" text-anchor="middle" font-size="11" fill="#166534">"I don't know" rule, 1-shot</text>

  <!-- LLM -->
  <rect x="930" y="350" width="170" height="100" rx="12" fill="url(#gradYellow)" stroke="#eab308" stroke-width="1.5"/>
  <text x="1015" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">LLM</text>
  <text x="1015" y="400" text-anchor="middle" font-size="12" fill="#854d0e">Phi-3-mini-4k</text>
  <text x="1015" y="418" text-anchor="middle" font-size="11" fill="#854d0e">(open, on Kaggle T4)</text>
  <text x="1015" y="436" text-anchor="middle" font-size="10" fill="#64748b">deterministic decoding</text>

  <!-- Arrows query row -->
  <line x1="190" y1="400" x2="225" y2="400" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="400" x2="465" y2="400" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="400" x2="685" y2="400" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="890" y1="400" x2="925" y2="400" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Final Answer -->
  <rect x="450" y="510" width="300" height="80" rx="12" fill="#0f172a" stroke="#0f172a"/>
  <text x="600" y="540" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Final Answer</text>
  <text x="600" y="562" text-anchor="middle" font-size="11" fill="#cbd5e1">with citations [source] (improved)</text>
  <text x="600" y="578" text-anchor="middle" font-size="11" fill="#cbd5e1">or "I don't know" for false-premise</text>

  <line x1="1015" y1="450" x2="1015" y2="490" stroke="#475569" stroke-width="2"/>
  <line x1="1015" y1="490" x2="600" y2="490" stroke="#475569" stroke-width="2"/>
  <line x1="600" y1="490" x2="600" y2="505" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Connect vector DB -> retrieval -->
  <line x1="755" y1="220" x2="755" y2="275" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="755" y1="275" x2="330" y2="275" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="330" y1="275" x2="330" y2="345" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="955" y1="220" x2="955" y2="285" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="955" y1="285" x2="395" y2="285" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="395" y1="285" x2="395" y2="345" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="30" y="630" width="1140" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="50" y="655" font-size="12" font-weight="700" fill="#0f172a">Four improvements measured before vs after:</text>
  <text x="50" y="678" font-size="11" fill="#334155">① Chunking (fixed → paragraph + overlap) &#8226; ② Embeddings (MiniLM → BGE) &#8226; ③ Hybrid retrieval + cross-encoder rerank &#8226; ④ Prompt engineering (citations + "I don't know" rule)</text>
  <text x="50" y="694" font-size="10" fill="#64748b">Runs free on Kaggle Notebooks (T4 GPU). No API keys. ChromaDB in-memory. Phi-3-mini local generation. ~5-10 min end-to-end including 18-question eval.</text>
</svg>
